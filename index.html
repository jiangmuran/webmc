<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>webmc</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0e14;
        color: #e6edf3;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(230, 237, 243, 0.12);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        user-select: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas" data-testid="main-canvas"></canvas>
      <div id="hud" data-testid="hud">booting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
